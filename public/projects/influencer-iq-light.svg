<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="purpleBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background (Clean Light Theme) -->
  <rect width="800" height="600" fill="#f8fafc"/>

  <!-- Top App Navigation -->
  <rect x="0" y="0" width="800" height="56" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Logo & Title -->
  <circle cx="36" cy="28" r="14" fill="#ec4899"/>
  <text x="36" y="33" fill="#ffffff" font-size="12" font-weight="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">IQ</text>
  <text x="60" y="33" fill="#0f172a" font-size="16" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Influencer<tspan fill="#ec4899">IQ</tspan></text>
  <text x="180" y="33" fill="#64748b" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">AI Creator Discovery &amp; ROI Engine</text>

  <!-- Search Bar -->
  <rect x="460" y="14" width="220" height="30" rx="15" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="33" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Search 500k+ creators...</text>

  <!-- User Avatar -->
  <circle cx="750" cy="28" r="15" fill="#e0e7ff"/>
  <circle cx="750" cy="24" r="6" fill="#6366f1"/>
  <ellipse cx="750" cy="37" rx="10" ry="6" fill="#6366f1"/>

  <!-- Main Hero Metric Row -->
  <!-- Card 1: Engagement -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="80" width="220" height="110" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="48" y="106" fill="#64748b" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">AVG. ENGAGEMENT RATE</text>
    <text x="48" y="145" fill="#0f172a" font-size="30" font-weight="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">6.42%</text>
    <rect x="48" y="158" width="85" height="20" rx="10" fill="#dcfce7"/>
    <text x="90" y="172" fill="#15803d" font-size="10" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">+14.2% vs Benchmark</text>
  </g>

  <!-- Card 2: Credibility -->
  <g filter="url(#cardShadow)">
    <rect x="270" y="80" width="230" height="110" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="288" y="106" fill="#64748b" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">AUDIENCE CREDIBILITY</text>
    <text x="288" y="145" fill="#0f172a" font-size="30" font-weight="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">96.8%</text>
    <rect x="288" y="158" width="90" height="20" rx="10" fill="#f3e8ff"/>
    <text x="333" y="172" fill="#7e22ce" font-size="10" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Bot-Filtered High</text>
  </g>

  <!-- Card 3: Forecasted ROI -->
  <g filter="url(#cardShadow)">
    <rect x="520" y="80" width="250" height="110" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="538" y="106" fill="#64748b" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">FORECASTED CAMPAIGN ROI</text>
    <text x="538" y="145" fill="#0f172a" font-size="30" font-weight="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">3.8x</text>
    <rect x="538" y="158" width="105" height="20" rx="10" fill="#e0e7ff"/>
    <text x="590" y="172" fill="#4338ca" font-size="10" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Predicted Revenue Match</text>
  </g>

  <!-- Main Chart Section: Campaign Reach & Conversions -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="210" width="470" height="230" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="50" y="238" fill="#0f172a" font-size="14" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Campaign Growth &amp; Engagement Trajectory</text>
    <text x="50" y="254" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Aggregated Creator Reach Across 90-Day Flight</text>

    <!-- Grid lines -->
    <line x1="50" y1="280" x2="480" y2="280" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="50" y1="320" x2="480" y2="320" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="50" y1="360" x2="480" y2="360" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="50" y1="400" x2="480" y2="400" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Chart Fill & Stroke -->
    <path d="M 60 380 Q 130 360, 190 320 T 320 290 T 410 260 T 470 245 L 470 410 L 60 410 Z" fill="url(#chartGrad)"/>
    <path d="M 60 380 Q 130 360, 190 320 T 320 290 T 410 260 T 470 245" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Chart Data Points -->
    <circle cx="190" cy="320" r="4" fill="#ec4899" stroke="#ffffff" stroke-width="2"/>
    <circle cx="320" cy="290" r="4" fill="#ec4899" stroke="#ffffff" stroke-width="2"/>
    <circle cx="410" cy="260" r="4" fill="#ec4899" stroke="#ffffff" stroke-width="2"/>
    <circle cx="470" cy="245" r="5" fill="#8b5cf6" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Right Panel: Top Matched Creators -->
  <g filter="url(#cardShadow)">
    <rect x="520" y="210" width="250" height="230" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="538" y="238" fill="#0f172a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">AI Creator Matches</text>
    
    <!-- Creator 1 -->
    <circle cx="555" cy="275" r="16" fill="#fce7f3"/>
    <text x="555" y="279" fill="#db2777" font-size="12" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">SJ</text>
    <text x="580" y="272" fill="#0f172a" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Sarah Jenkins</text>
    <text x="580" y="287" fill="#64748b" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Tech &amp; AI • 940k followers</text>
    <rect x="710" y="265" width="45" height="20" rx="10" fill="#ecfdf5"/>
    <text x="732" y="279" fill="#059669" font-size="10" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">98%</text>

    <!-- Creator 2 -->
    <circle cx="555" cy="330" r="16" fill="#ede9fe"/>
    <text x="555" y="334" fill="#7c3aed" font-size="12" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">AR</text>
    <text x="580" y="327" fill="#0f172a" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Alex Rivera</text>
    <text x="580" y="342" fill="#64748b" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">SaaS Growth • 620k followers</text>
    <rect x="710" y="320" width="45" height="20" rx="10" fill="#ecfdf5"/>
    <text x="732" y="334" fill="#059669" font-size="10" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">95%</text>

    <!-- Creator 3 -->
    <circle cx="555" cy="385" r="16" fill="#fef3c7"/>
    <text x="555" y="389" fill="#d97706" font-size="12" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">MD</text>
    <text x="580" y="382" fill="#0f172a" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Maya Dave</text>
    <text x="580" y="397" fill="#64748b" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">DevOps • 380k followers</text>
    <rect x="710" y="375" width="45" height="20" rx="10" fill="#ecfdf5"/>
    <text x="732" y="389" fill="#059669" font-size="10" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">91%</text>
  </g>

  <!-- Bottom Action Bar / Status -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="460" width="740" height="110" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="50" y="492" fill="#0f172a" font-size="14" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Active Campaign: Fall Creator Sprint 2026</text>
    <text x="50" y="512" fill="#64748b" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Target Audience: Full-Stack Engineers &amp; Founders • Budget: $25,000 • Projected Leads: 4,200</text>
    
    <!-- Progress Bar -->
    <rect x="50" y="530" width="540" height="10" rx="5" fill="#f1f5f9"/>
    <rect x="50" y="530" width="380" height="10" rx="5" fill="url(#purpleBtn)"/>

    <!-- CTA Button -->
    <rect x="620" y="488" width="130" height="38" rx="19" fill="url(#purpleBtn)"/>
    <text x="685" y="512" fill="#ffffff" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Launch Match &#8594;</text>
  </g>
</svg>
